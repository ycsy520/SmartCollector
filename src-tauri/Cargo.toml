[package]
name = "smart-collector"
version = "0.1.0"
description = "Smart Collector - 桌面端 AI 信息收集工具"
authors = ["ycsy520"]
edition = "2021"

[lib]
name = "smart_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：批次21-B 起真要服务 $APPDATA/media 下的收藏图片，
# 须与 tauri.conf.json 的 app.security.assetProtocol（enable + scope）同时到位，缺一前端只会拿到 403/空白。
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
chrono = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# P5 传输层：reqwest 同步 blocking 客户端，rustls 纯 Rust TLS（避开 native-tls/openssl）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# P6 向量持久化：sqlite-vec 虚表扩展，经 sqlite3_auto_extension 注册进 rusqlite bundled SQLite
sqlite-vec = "0.1"
# P8 密钥落位：系统凭据管理器（Windows Credential Manager）。
# ⚠️ 必须显式开 windows-native：keyring v3 默认特性不含任何原生后端，Entry 会退化成
# 进程内内存 builder——set_password 返回 Ok 但随实例 drop 即丢，get_password 恒 NoEntry，
# 表现为"保存成功却读不到密钥 / 测试永远 E_CONFIG_MISSING"。
keyring = { version = "3", default-features = false, features = ["windows-native"] }
arboard = { version = "3.6.1", default-features = false }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.8.0"

# 后续阶段依赖按 01 清单 §2.1 在对应阶段添加（奥卡姆：不提前引入未使用依赖）：
# P2: thiserror
# P3: rusqlite(bundled,fts5) r2d2 r2d2_sqlite
# P4: tokio uuid chrono
# P5: reqwest(rustls-tls)
# P6: sqlite-vec
# P8: tauri-plugin-global-shortcut / tauri-plugin-single-instance / tauri-plugin-autostart / arboard / keyring

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
